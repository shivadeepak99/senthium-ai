# Test configuration for IPC integration tests
# Minimal config for daemon testing - security disabled

senthium:
  version: '0.2'
  
  # Daemon settings
  poll_interval: 5
  max_awake_duration: 14400  # 4 hours
  
  # Minimal test rule
  rules:
    - name: "Test Rule"
      type: "process"
      enabled: true
      processes:
        - "python.exe"
